[package]
name = "dustagent"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
authors = ["DustAgent Contributors"]
description = "Ultra-lightweight Unix-style Agent as an Application (AaaA) runtime"
license = "MIT OR Apache-2.0"
repository = "https://github.com/choratools/dustagent"
homepage = "https://github.com/choratools/dustagent"
readme = "README.md"
keywords = ["ai-agent", "mcp", "llm", "unix", "patcher"]
categories = ["command-line-utilities", "development-tools"]

[lib]
name = "dustagent"
path = "src/lib.rs"

[[bin]]
name = "dust"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.40", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
thiserror = "2.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
async-trait = "0.1"
regex = "1.10"
strsim = "0.11"
uuid = { version = "1.10", features = ["v4"] }
sha2 = "0.10"

tempfile = "3.10"
tar = "0.4"
flate2 = "1.0"
serde_yaml = "0.9"
aes-gcm = "0.10.3"
argon2 = "0.5.3"
rpassword = "7.5.4"
zeroize = "1.8"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
